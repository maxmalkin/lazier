[package]
name = "lazier"
version = "0.9.2"
edition = "2024"
rust-version = "1.85"
description = "A fast terminal user interface for git, written in Rust with ratatui and gitoxide"
repository = "https://github.com/maxmalkin/lazier"
license = "MIT"
readme = "README.md"
keywords = ["git", "tui", "terminal", "ratatui"]
categories = ["command-line-utilities", "development-tools"]
# Keep the package small. A user who installs the program does not need
# the test data or the build instructions.
exclude = ["src/snapshots/", ".github/", ".gitignore"]

[profile.release]
# A smaller and quicker program. The build takes more time.
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1"
gix = { version = "0.86.0", features = ["status", "max-performance-safe"] }
notify = "8.2.0"
ratatui = "0.30"

[dev-dependencies]
insta = "1"
