name: release

# Build the program for each platform when a version tag arrives.
# Put the results on the release page.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          # Apple Silicon runners can build the Intel program. Intel
          # runners are scarce, thus this is quicker.
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Intel Windows runners can build the ARM program.
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Make the archive
        if: runner.os != 'Windows'
        run: |
          tar -czf lazier-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release lazier
      # Windows users expect a zip file.
      - name: Make the archive for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/lazier.exe `
            -DestinationPath lazier-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lazier-${{ matrix.target }}
          path: lazier-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Make the checksum file
        run: sha256sum *.tar.gz *.zip > lazier-sha256sums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
            lazier-sha256sums.txt
          generate_release_notes: true
